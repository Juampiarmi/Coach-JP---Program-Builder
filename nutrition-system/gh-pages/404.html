<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach JP · Ruta no encontrada</title>
<meta name="theme-color" content="#0B0F17">
<script>
  /* 404 de GitHub Pages (raíz del sitio). Cualquier variante de la ruta del Nutrition Builder
     (/Nutrition/, /nutrition-system/, /nutrition/lo-que-sea) se redirige a /<repo>/nutrition/.
     El parámetro cjp404 evita loops si el deploy de /nutrition/ faltara. */
  (function () {
    var p = location.pathname, low = p.toLowerCase(), seg = p.split('/');
    // Sitio de proyecto: el 1.er segmento es el repo (salvo que ya sea /nutrition… o un archivo en la raíz).
    var repo = seg.length > 2 && seg[1] && !/^nutrition/i.test(seg[1]) ? '/' + seg[1] : '';
    if (/\/nutrition(-system)?(\/|$)/.test(low) && location.search.indexOf('cjp404') < 0) {
      var q = location.search ? location.search + '&cjp404=1' : '?cjp404=1';
      location.replace(repo + '/nutrition/' + q + location.hash);
    }
    window.__repo = repo;
  })();
</script>
<style>
  html,body{margin:0;min-height:100%;background:#0B0F17;color:#94A3B8;font-family:Inter,system-ui,sans-serif}
  body{display:grid;place-items:center;min-height:100vh;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
  .c{max-width:420px;margin:24px;padding:24px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#131B2A}
  .t{font:700 11px ui-monospace,monospace;letter-spacing:.2em;color:#38BDF8}
  h1{color:#fff;font-size:22px;margin:10px 0 6px}
  a{display:inline-block;margin:14px 10px 0 0;padding:10px 14px;border-radius:9px;font:700 11px ui-monospace,monospace;letter-spacing:.1em;text-decoration:none}
  .a1{background:#F97316;color:#fff}.a2{border:1px solid rgba(56,189,248,.3);color:#38BDF8}
</style>
</head>
<body>
  <div class="c">
    <div class="t">[ 404 · RUTA NO ENCONTRADA ]</div>
    <h1>Esta página no existe</h1>
    <p>Revisá el link o volvé a una de las apps de Coach JP.</p>
    <a class="a1" id="n" href="./nutrition/">NUTRITION BUILDER</a><a class="a2" id="h" href="./">APP DE ENTRENAMIENTO</a>
  </div>
  <script>
    document.getElementById('n').href = (window.__repo || '') + '/nutrition/';
    document.getElementById('h').href = (window.__repo || '') + '/';
  </script>
</body>
</html>
