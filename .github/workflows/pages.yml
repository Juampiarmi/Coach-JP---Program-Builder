# Publica en GitHub Pages el sitio estático completo:
#   /                → app de entrenamiento existente (index.html, dashboard.html, showroom…)
#   /nutrition/      → Nutrition Command Builder (Next.js export estático de nutrition-system/)
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nutrition-system/package-lock.json

      - name: Build Nutrition Command Builder
        working-directory: nutrition-system
        run: |
          npm ci
          npm run build
        # next.config.mjs deriva basePath=/<repo>/nutrition de GITHUB_REPOSITORY.

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'nutrition-system' --exclude '_site' ./ _site/
          cp -r nutrition-system/out _site/nutrition
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
