# Red de seguridad de Tactical Canvas: tipos, tests unitarios (parser, prompts, IA, doctor),
# build y tests en navegador (regresión visual de las plantillas 01–05 sobre el PNG exportado,
# auditoría del plan semanal en 4:5 y 9:16, biblioteca y deshacer).
name: Tactical Canvas · tests

on:
  push:
    branches: [main]
    paths: ['tactical-canvas/**', '.github/workflows/tactical-canvas.yml']
  pull_request:
    paths: ['tactical-canvas/**', '.github/workflows/tactical-canvas.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tactical-canvas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tactical-canvas/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build

      - name: Chromium de Playwright (mismo build que fija @playwright/test)
        run: npx playwright install --with-deps chromium

      - name: Tests en navegador
        run: npx playwright test

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tactical-canvas/playwright-report
            tactical-canvas/test-results
          retention-days: 7
