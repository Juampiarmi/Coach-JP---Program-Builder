# Publica en GitHub Pages el sitio estático completo:
#   /                → app de entrenamiento existente (index.html, dashboard.html, showroom…)
#   /nutrition/      → Nutrition Command Builder (Next.js export estático de nutrition-system/)
# Requisito: Settings → Pages → Source: "GitHub Actions".
# Si la fuente quedó en "Deploy from a branch", GitHub corre además su build automático (Jekyll)
# sobre main, que NO contiene /nutrition/ y pisa este deploy si termina después (→ 404).
# El job deploy espera a que ese build termine, publica último y verifica la URL en vivo.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nutrition-system/package-lock.json

      - name: Build Nutrition Command Builder
        working-directory: nutrition-system
        env:
          # basePath/assetPrefix explícitos: el Builder vive en https://<usuario>.github.io/<repo>/nutrition/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/nutrition
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'nutrition-system' --exclude '_site' ./ _site/
          # El export de Next va SIEMPRE a _site/nutrition (sin anidar out/ si la carpeta ya existiera).
          rm -rf _site/nutrition
          cp -r nutrition-system/out _site/nutrition
          # 404 de Pages en la raíz (sólo si la app principal no trae uno propio).
          [ -f _site/404.html ] || cp nutrition-system/gh-pages/404.html _site/404.html
          touch _site/.nojekyll

      - name: Verify artifact
        run: |
          BASE="/${{ github.event.repository.name }}/nutrition"
          test -f _site/index.html || { echo "::error::Falta la app principal (_site/index.html)"; exit 1; }
          test -f _site/nutrition/index.html || { echo "::error::Falta _site/nutrition/index.html"; exit 1; }
          test -f _site/nutrition/manifest.webmanifest || { echo "::error::Falta el manifest del Builder"; exit 1; }
          grep -q "$BASE/_next/static/" _site/nutrition/index.html || { echo "::error::index.html no referencia $BASE/_next/static/ (basePath incorrecto)"; exit 1; }
          JS=$(grep -o "$BASE/_next/static/[^\"]*\.js" _site/nutrition/index.html | head -1)
          test -f "_site/${JS#/${{ github.event.repository.name }}/}" || { echo "::error::No existe el chunk $JS en el artifact"; exit 1; }
          echo "OK · Builder en $BASE/ · chunk verificado: $JS"
          ls _site _site/nutrition

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Esperar al build automático de Pages (fuente "Deploy from a branch")
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            pending=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            if [ "$pending" = "0" ]; then echo "Sin builds automáticos pendientes: este deploy publica último."; break; fi
            echo "::notice::pages-build-deployment (Jekyll sobre main) sigue corriendo; espero para no ser pisado ($i/60)"
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar Builder en vivo
        env:
          URL: ${{ steps.deployment.outputs.page_url }}nutrition/
          SHA: ${{ github.sha }}
        run: |
          # ?v=<sha> esquiva la caché del CDN de Pages (un 404 servido por el build de Jekyll queda cacheado hasta 10 min).
          for i in $(seq 1 24); do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$URL?v=$SHA" || echo 000)
            if [ "$code" = "200" ] && grep -q '/nutrition/_next/static/' /tmp/page.html; then echo "OK · $URL responde 200 con el Builder"; exit 0; fi
            echo "Intento $i: $URL → HTTP $code"; sleep 15
          done
          echo "::error::$URL no sirve el Builder. Revisá Settings → Pages → Source: debe ser \"GitHub Actions\" (con \"Deploy from a branch\" el build de Jekyll sobre main pisa este deploy)."
          exit 1
