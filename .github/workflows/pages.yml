# Publica en GitHub Pages el sitio estático completo:
#   /                → app de entrenamiento existente (index.html, dashboard.html, showroom…)
#   /nutrition/      → Nutrition Command Builder (Next.js export estático de nutrition-system/)
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nutrition-system/package-lock.json

      - name: Build Nutrition Command Builder
        working-directory: nutrition-system
        env:
          # basePath/assetPrefix explícitos: el Builder vive en https://<usuario>.github.io/<repo>/nutrition/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/nutrition
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'nutrition-system' --exclude '_site' ./ _site/
          # El export de Next va SIEMPRE a _site/nutrition (sin anidar out/ si la carpeta ya existiera).
          rm -rf _site/nutrition
          cp -r nutrition-system/out _site/nutrition
          # 404 de Pages en la raíz (sólo si la app principal no trae uno propio).
          [ -f _site/404.html ] || cp nutrition-system/gh-pages/404.html _site/404.html
          touch _site/.nojekyll

      - name: Verify artifact
        run: |
          BASE="/${{ github.event.repository.name }}/nutrition"
          test -f _site/index.html || { echo "::error::Falta la app principal (_site/index.html)"; exit 1; }
          test -f _site/nutrition/index.html || { echo "::error::Falta _site/nutrition/index.html"; exit 1; }
          test -f _site/nutrition/manifest.webmanifest || { echo "::error::Falta el manifest del Builder"; exit 1; }
          grep -q "$BASE/_next/static/" _site/nutrition/index.html || { echo "::error::index.html no referencia $BASE/_next/static/ (basePath incorrecto)"; exit 1; }
          JS=$(grep -o "$BASE/_next/static/[^\"]*\.js" _site/nutrition/index.html | head -1)
          test -f "_site/${JS#/${{ github.event.repository.name }}/}" || { echo "::error::No existe el chunk $JS en el artifact"; exit 1; }
          echo "OK · Builder en $BASE/ · chunk verificado: $JS"
          ls _site _site/nutrition

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
