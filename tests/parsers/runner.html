<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests de parsers · Coach JP</title>
<style>
  :root{ --bg:#0A0A0A; --pn:#141414; --ln:#262626; --tx:#EDEDED; --mu:#8a8a8a; --ok:#2ecc71; --ko:#ff5a5f; --gp:#f5a524; --cy:#22d3ee; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header{ position:sticky; top:0; z-index:5; background:rgba(10,10,10,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--ln); padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  h1{ font-size:16px; margin:0; letter-spacing:.04em; }
  .pill{ padding:3px 10px; border-radius:999px; border:1px solid var(--ln); font-weight:600; font-variant-numeric:tabular-nums; }
  .pill.ok{ color:var(--ok); border-color:var(--ok); } .pill.ko{ color:var(--ko); border-color:var(--ko); } .pill.gp{ color:var(--gp); border-color:var(--gp); }
  button,label{ font:inherit; color:var(--tx); } button{ background:var(--pn); border:1px solid var(--ln); border-radius:8px; padding:6px 12px; cursor:pointer; }
  main{ padding:12px 16px 60px; max-width:1100px; margin:0 auto; }
  h2{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--cy); margin:22px 0 6px; }
  .row{ display:grid; grid-template-columns:84px 1fr; gap:4px 12px; padding:8px 10px; border:1px solid var(--ln); background:var(--pn); border-radius:8px; margin-bottom:6px; }
  .row .st{ font-weight:700; font-size:12px; letter-spacing:.06em; }
  .row.pass .st{ color:var(--ok); } .row.fail .st{ color:var(--ko); } .row.gap .st{ color:var(--gp); } .row.gapfix .st{ color:var(--cy); }
  .row .id{ color:var(--mu); font-size:12px; } .row .nt{ color:var(--mu); font-size:12px; }
  pre{ margin:4px 0 0; padding:8px; background:#0d0d0d; border:1px solid var(--ln); border-radius:6px; white-space:pre-wrap; word-break:break-word; font:12px/1.4 ui-monospace,Consolas,monospace; }
  .cols{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; grid-column:1 / -1; }
  @media (max-width:760px){ .cols{ grid-template-columns:1fr; } .row{ grid-template-columns:1fr; } }
  .cols b{ font-size:11px; color:var(--mu); text-transform:uppercase; letter-spacing:.06em; }
  .hide{ display:none; }
</style>
</head>
<body>
<header>
  <h1>TESTS DE PARSERS · COACH JP</h1>
  <span class="pill" id="pTotal">…</span><span class="pill ok" id="pOk">0 ok</span><span class="pill ko" id="pKo">0 fallan</span>
  <span class="pill gp" id="pGp">0 gaps</span>
  <label><input type="checkbox" id="soloFallas"> solo fallas y gaps</label>
  <button id="bCopiar">Copiar reporte</button>
  <button id="bReload">Volver a correr</button>
</header>
<main id="out"><p>Cargando la app en un iframe…</p></main>
<iframe id="app" src="../../index.html" style="position:absolute; left:-9999px; width:420px; height:800px; border:0" aria-hidden="true"></iframe>
<script src="cases.js"></script>

<script>
/* El runner NUNCA modifica index.html ni guarda estado: solo llama funciones puras del iframe.
   Hay que servirlo por http (file:// bloquea el acceso al iframe):   npx http-server -p 8765   o   python -m http.server 8765
   y abrir  http://localhost:8765/tests/parsers/runner.html  */
(function(){
  var win;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function fmt(v){ if(v instanceof RegExp) return String(v); try{ var s = JSON.stringify(v, function(k, x){ return x instanceof RegExp ? String(x) : x; }, 2); return s === undefined ? 'undefined' : s; }catch(e){ return String(v); } }
  function igual(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
  /* subset: objetos -> solo claves de expect; arrays -> mismo largo y subset por posicion; resto -> igualdad */
  function subset(exp, act){
    if(exp === null || typeof exp !== 'object') return exp === act;
    if(Array.isArray(exp)){ return Array.isArray(act) && act.length === exp.length && exp.every(function(e, i){ return subset(e, act[i]); }); }
    if(act === null || typeof act !== 'object') return false;
    return Object.keys(exp).every(function(k){ return subset(exp[k], act[k]); });
  }
  function texto(v){ return Array.isArray(v) ? v.join('\n') : String(v); }

  /* ---------- adaptadores: que funcion real se llama y con que ---------- */
  var ADAPT = {
    autoformat: { run: function(i){ return win.jpAutoFormat.procesarTexto(i); }, valor: function(r){ return r.lineas; }, siguiente: function(r){ return win.jpAutoFormat.procesarTexto(r.lineas.join('\n')).lineas; } },
    wod:        { run: function(i){ return win.jpAutoFormat.formatearWod(i); }, valor: function(r){ return r; }, siguiente: function(r){ return win.jpAutoFormat.formatearWod(r); } },
    esWod:      { run: function(i){ return !!win.jpAutoFormat.esWodBloque(i.bloque, i.texto); }, valor: function(r){ return r; } },
    cfFormato:  { run: function(i){ var f = win.detectarFormatoCF(i); return f ? f.fmt : null; }, valor: function(r){ return r; } },
    dosis:      { run: function(i){ return win.jpDosisCanon(i); }, valor: function(r){ return r; } },
    tag:        { run: function(i){ return win.impCampoCoachDeTag(i); }, valor: function(r){ return r; } },
    segundos:   { run: function(i){ return win.impSegundosDeTexto(i); }, valor: function(r){ return r; } },
    importSB:   { run: function(i){ return win.parsearImportacion(i, true); }, valor: function(r){ return r; } },
    importCF:   { run: function(i){ return win.parsearImportacion(i, false); }, valor: function(r){ return r; } },
    /* banco de rutinas: devuelven la lista de problemas encontrados (lo esperado es []) */
    bancoBB:      { run: function(i){ return auditarBancoBB(i); }, valor: function(r){ return r; } },
    bancoHyx:     { run: function(i){ return auditarBancoHyx(i); }, valor: function(r){ return r; } },
    bancoNombres: { run: function(i){ return auditarNombres(i); }, valor: function(r){ return r; } },
    bancoEditor:  { run: function(i){ return auditarEditor(i); }, valor: function(r){ return r; } },
    bancoSplit3:  { run: function(i){ return auditarSplit3(i); }, valor: function(r){ return r; } },
    /* generadores de IA del Builder (CrossFit): con el motor de IA simulado, sin red y sin guardar nada */
    iaCF:         { run: function(i){ return iaCaso(i); }, valor: function(r){ return r; } },
    cruceCF:      { run: function(i){ return cruceCaso(i); }, valor: function(r){ return r; } },
    copiaCF:      { run: function(i){ return copiaCaso(i); }, valor: function(r){ return r; } },
    showroom:     { run: function(i){ return showroomCaso(i); }, valor: function(r){ return r; } },
    alumnoEstilo: { run: function(i){ return alumnoEstilo(i); }, valor: function(r){ return r; } },
    alumnoTon: { run: function(i){ return alumnoTon(i); }, valor: function(r){ return r; } },
    alumnoPautas: { run: function(i){ return alumnoPautas(i); }, valor: function(r){ return r; } },
    bancoGluteos: { run: function(){ return auditarGluteos(); }, valor: function(r){ return r; } },
    copiaPlan:    { run: function(i){ return copiaPlanCaso(i); }, valor: function(r){ return r; } },
    pedagogiaBB:  { run: function(i){ return pedagogiaCaso(i); }, valor: function(r){ return r; } },
    eliteBB:      { run: function(i){ return eliteCaso(i); }, valor: function(r){ return r; } },
    eliteEd:      { run: function(i){ return eliteEdit(i); }, valor: function(r){ return r; } },
    bancoMetabolicos: { run: function(){ return auditarMetabolicos(); }, valor: function(r){ return r; } },
    alumnoPiel: { run: function(i){ return alumnoPiel(i); }, valor: function(r){ return r; } },
    alumnoStory: { run: function(i){ return alumnoStory(i); }, valor: function(r){ return r; } },
    alumnoCircuitos: { run: function(i){ return alumnoCircuitos(i); }, valor: function(r){ return r; } },
    alumnoEstaciones: { run: function(i){ return alumnoEstaciones(i); }, valor: function(r){ return r; } },
    alumnoProg:   { run: function(i){ return alumnoProgresion(i); }, valor: function(r){ return r; } },
    editorPlan:   { run: function(i){ return editorCaso(i); }, valor: function(r){ return r; } },
    bancoSinRopes: { run: function(i){ return auditarSinRopes(i); }, valor: function(r){ return r; } },
    bancoRecFem:  { run: function(i){ return auditarRecFem(i); }, valor: function(r){ return r; } },
    /* app del alumno: objetivo de la semana en la información de la semana */
    alumnoObjetivo: { run: function(i){ return alumnoObjetivoSemana(i); }, valor: function(r){ return r; } },
    /* app del alumno: se compila un alumno de prueba con el compile() real, se abre en un iframe y se llaman sus funciones globales (input: { fn, args }) */
    alumnoParidad: { run: function(lista){ var w = alumnoWin(); if(!w || typeof w.jpDosisCanon !== 'function') throw new Error('la app del alumno no expone jpDosisCanon'); return lista.filter(function(x){ return JSON.stringify(w.jpDosisCanon(x)) !== JSON.stringify(win.jpDosisCanon(x)); }).map(function(x){ return 'distinto para: ' + x; }); }, valor: function(r){ return r; } },
    alumno:       { run: function(i){ var w = alumnoWin(); if(!w || typeof w[i.fn] !== 'function') throw new Error('la app del alumno no expone ' + i.fn); return w[i.fn].apply(w, i.args || []); }, valor: function(r){ return r; } }
  };

  /* ---------- app del alumno compilada (sin tocar el estado real: el alumno de prueba y su plan viven solo durante el compile) ---------- */
  var alumnoFrame = null;
  function alumnoWin(){ return alumnoFrame && alumnoFrame.contentWindow; }
  function prepararAlumno(cb){
    try{
      var S = getS(), id = 'ath_test_runner', fake = { id: id, nombre: 'Prueba', apellido: 'Runner', freq: 4, nivel: 'intermedio', genero: 'M', createdAt: Date.now() }, html = '';
      S.athletes.push(fake);      /* compile() solo acepta alumnos registrados: va y vuelve en el mismo instante, sin guardar nada */
      try{ S.plans[id] = win.newPlan(fake); html = win.compile(fake); } finally { delete S.plans[id]; var ix = S.athletes.indexOf(fake); if(ix >= 0) S.athletes.splice(ix, 1); }
      alumnoFrame = document.createElement('iframe'); alumnoFrame.style.cssText = 'position:absolute;left:-9999px;width:420px;height:800px;border:0'; alumnoFrame.setAttribute('aria-hidden', 'true');
      document.body.appendChild(alumnoFrame); alumnoFrame.srcdoc = html;
    }catch(e){ console.warn('app del alumno', e); return cb(); }
    var n = 0;
    (function esp(){ try{ if(alumnoWin().jpDosisCanon && alumnoWin().jpLimpiarDecimal) return cb(); }catch(e){} if(++n > 40) return cb(); setTimeout(esp, 250); })();
  }
  function limpiarAlumno(){ try{ Object.keys(localStorage).filter(function(k){ return /prueba_runner/.test(k); }).forEach(function(k){ localStorage.removeItem(k); }); }catch(e){} }

  /* ---------- auditoría de plantillas del Banco ---------- */
  function getS(){ try{ return win.eval('S') || {}; }catch(e){ return {}; } }
  /* logística de salón: ningún biset / triset debe haberse reemplazado ni separado por cruzar de estación (el saneador de la app lo registra) */
  function logistica(id){ return ((win.JP_SANEO_LOG || {})[id] || []).filter(function(c){ return c.accion !== 'tempo'; }).map(function(c){ return id + ': logística de salón (' + c.accion + ') · ' + c.detalle; }); }
  function lineasTips(b){ return String(b.tips || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
  function seriesDe(items){ var n = 0; (items || []).forEach(function(l){ var m = /^(\d+)\s*x\s*\d/i.exec(String(l)); if(m) n += parseInt(m[1], 10); }); return n; }
  /* una sesión: estructura obligatoria + calidad de las notas. op: { minSeries, minHiper } */
  function auditarDia(nombre, d, op){
    var P = [], tag = nombre + ' · ' + (d.short || '') + ' ' + (d.title || '');
    var bl = d.bloques || [];
    if(!bl.length){ return [tag + ': sin bloques']; }
    if(bl[0].modalidad !== 'calentamiento') P.push(tag + ': el primer bloque no es la entrada en calor');
    var cuenta = function(m){ return bl.filter(function(b){ return b.modalidad === m; }).length; };
    if(cuenta('fuerza') < 1) P.push(tag + ': falta el ejercicio principal de fuerza');
    if(cuenta('hipertrofia') < (op.minHiper || 2)) P.push(tag + ': menos de ' + (op.minHiper || 2) + ' bloques de hipertrofia / accesorios');
    if(cuenta('core') < 1) P.push(tag + ': falta el core');
    if(cuenta('metcon') < 1) P.push(tag + ': falta el cardio / finisher metabólico');
    if(!bl.some(function(b){ return (b.items || []).some(function(l){ return /^A2\.\s/.test(l); }); })) P.push(tag + ': falta un biset o triset');
    if(String(d.focusText || '').length < 200) P.push(tag + ': el foco del día es muy corto');
    if((bl[0].items || []).length < 5) P.push(tag + ': la entrada en calor tiene menos de 5 ejercicios');
    var series = 0;
    bl.forEach(function(b, i){
      series += seriesDe(b.items);
      if(!String(b.objective || '').trim()) P.push(tag + ' · bloque ' + (i + 1) + ': sin objetivo fisiológico');
      var tips = lineasTips(b);
      if(tips.length < 3) P.push(tag + ' · bloque ' + (i + 1) + ': menos de 3 pautas (' + tips.length + ')');
      if((b.items || []).some(function(l){ return /^\s*(?:SET-UP|CUE|CUIDADO|POR QU[ÉE]|PROGRESI[ÓO]N|SENSACI[ÓO]N|RITMO|TEMPO)\b|^\[/.test(l); })) P.push(tag + ' · bloque ' + (i + 1) + ': una pauta quedó dentro de los ejercicios');
      if(b.modalidad === 'metcon'){
        if(/^\d+x\d/i.test(String((b.items || [])[0] || ''))) P.push(tag + ' · bloque ' + (i + 1) + ': el cardio / finisher se convirtió en una dosis de fuerza');
        if((b.items || []).some(function(l){ return /\|\s*RIR/i.test(l); })) P.push(tag + ' · bloque ' + (i + 1) + ': el cardio / finisher quedó con RIR');
      }
    });
    if(op.minSeries && series < op.minSeries) P.push(tag + ': solo ' + series + ' series (mínimo ' + op.minSeries + ')');
    return P;
  }
  function auditarBancoBB(){
    var PB = win.__jpPB, P = [];
    if(!PB || !PB.LISTA || PB.LISTA.length !== 12) P.push('esperaba 12 plantillas Bodybuilding y hay ' + (PB && PB.LISTA ? PB.LISTA.length : 0));
    (PB.LISTA || []).forEach(function(t){
      var dias = PB.construirDias(t), av = t.niv === 'avanzado';
      if(dias.length !== t.f) P.push(t.id + ': tiene ' + dias.length + ' días y debería tener ' + t.f);
      dias.forEach(function(d){ auditarDia(t.id, d, { minSeries: av ? 28 : 24, minHiper: 2 }).forEach(function(x){ P.push(x); }); });
      logistica(t.id).forEach(function(x){ P.push(x); });
    });
    return P;
  }
  function auditarBancoHyx(){
    var P = [], hx = (getS().banco || []).filter(function(r){ return r && r.depDeporte === 'hyx'; });
    if(hx.length !== 18) P.push('esperaba 18 plantillas Hyrox y hay ' + hx.length);
    hx.forEach(function(r){
      if(!(r.dias || []).length){ P.push(r.id + ': sin días'); return; }
      if(r.dias.length !== r.freq) P.push(r.id + ': tiene ' + r.dias.length + ' días y debería tener ' + r.freq);
      r.dias.forEach(function(d){ auditarDia(r.id, d, { minSeries: 14, minHiper: 1 }).forEach(function(x){ P.push(x); }); });
      logistica(r.id).forEach(function(x){ P.push(x); });
    });
    return P;
  }
  /* todos los ejercicios nombrados en las sesiones existen en la biblioteca (el video se vincula solo) */
  function auditarNombres(){
    var PB = win.__jpPB, P = [], vistos = {};
    var chequear = function(e, donde){ if(!vistos[e] && !PB.exLib(e)){ vistos[e] = 1; P.push(donde + ': «' + e + '» no está en la biblioteca'); } };
    Object.keys(PB.D).forEach(function(k){ PB.D[k].filas.forEach(function(r){ if(r.fin) return; [].concat(r.ej || []).concat(r.ea || []).forEach(function(e){ chequear(e, k); }); }); });
    Object.keys(PB.WU).forEach(function(k){ PB.WU[k].items.forEach(function(x){ var m = /^(.*?)\s+x\s+(.+)$/.exec(x); chequear(m ? m[1] : x, 'warm-up ' + k); }); });
    PB.hyroxClaves.forEach(function(k){ [0, 1, 2].forEach(function(lv){ [false, true].forEach(function(f){
      PB.hyroxSesion(k, { lv: lv, f: f, dias: 5 }).def.filas.forEach(function(r){ if(r.fin) return; [].concat(r.ej || []).concat(r.ea || []).forEach(function(e){ chequear(e, 'Hyrox ' + k); }); });
    }); }); });
    return P;
  }
  /* editor del Banco: ver que exista la API y que lo editado de un sistema se persista (la prueba de punta a punta está en el README: usa la UI) */
  function auditarEditor(){
    var P = [], w = win, S = getS(), B = w.CoachBaseJP;
    if(!B || typeof B.editar !== 'function') return ['CoachBaseJP.editar no existe'];
    var r = (S.banco || []).filter(function(x){ return x.id === 'bkstd_jp26_m3_i'; })[0];
    if(!r) return ['no está bkstd_jp26_m3_i'];
    if(!(r.dias || []).length) P.push('la plantilla del sistema no tiene días hidratados');
    return P;
  }
  /* split analítico de 3 días: hombre Push / Pull / Pierna completa; mujer Pierna A / Push, Pull y Brazos / Pierna B (nada de Full Body) */
  /* ---------- cambio de alumno: estado cruzado entre modalidades ---------- */
  function cruceCaso(c){
    var S = getS(), A = [], ids = ['ath_test_cr_a', 'ath_test_cr_b'];
    var orig = { save: win.save, ga: win.guardarAhora, rb: win.renderBuilder, ra: win.renderAthletes, toast: win.toast, act: S.activeId, ui: S.ui ? { day: S.ui.day, cfWeek: S.ui.cfWeek } : {}, dpa: S.ui && S.ui.diaPorAlumno };
    win.save = win.guardarAhora = win.renderAthletes = function(){}; win.toast = function(){};
    function alumno(id, nombre, cf){
      var a = { id: id, nombre: nombre, apellido: 'Cruce', freq: 5, nivel: 'Avanzado', genero: 'F' }; S.athletes.push(a); A.push(a);
      var p = win.newPlan(a); p.meta.mesoDisc = cf ? 'crossfit' : 'hiper'; S.plans[id] = p; return p;
    }
    try{
      S.ui = S.ui || {}; S.ui.diaPorAlumno = {};
      var pA = alumno(ids[0], 'Cecilia', false), pB = alumno(ids[1], 'Heliana', true);
      [0, 1, 2].forEach(function(i){ pA.dias[i].bloques.push(win.nuevoBloquePizarra(false, 'strength', 'Hip thrust D' + (i + 1), ['Hip thrust con barra', '4x8 | RIR 2'])); });
      win.jpActivarAlumno(ids[1]); var psB = win.asegurarBloquesPorSemana(pB.dias[0]); psB[0].push(win.nuevoBloquePizarra(true, 'metcon', 'WOD D1', ['AMRAP 10', '10 Burpees'])); pB.dias[0].bloques = psB[0];
      win.jpActivarAlumno(ids[0]); S.ui.day = 2;
      var resA = function(){ return pA.dias.map(function(d){ return d.bloques.map(function(b){ return b.titulo; }).join('+') || '-'; }).join(' | '); };
      var resB = function(){ return pB.dias.map(function(d){ return win.asegurarBloquesPorSemana(d).map(function(x){ return x.length; }).join('/'); }).join(' | '); };
      var a0 = resA(), b0 = resB();

      if(c.caso === 'cambio'){
        var ep0 = win.__jpEpocaAlumno;
        win.jpActivarAlumno(ids[1]);
        return { dia: S.ui.day, semana: S.ui.cfWeek, activo: S.activeId === ids[1], aIntacto: resA() === a0, bIntacto: resB() === b0, referencias: win.jpAuditarReferenciasCompartidas(S.plans).length,
          epocaCambio: win.__jpEpocaAlumno > ep0, vigenteViejo: win.jpAlumnoVigente(ids[0], ep0), vigenteNuevo: win.jpAlumnoVigente(ids[1], win.__jpEpocaAlumno) };
      }
      if(c.caso === 'vuelta'){
        win.jpActivarAlumno(ids[1]); S.ui.day = 0; win.jpActivarAlumno(ids[0]);
        return { diaDeA: S.ui.day, aIntacto: resA() === a0, bIntacto: resB() === b0 };
      }
      if(c.caso === 'confirmaSaliente'){
        /* alumno CrossFit saliente con un cambio sin confirmar (puntero reasignado): al cambiar de alumno ese cambio se guarda en SU semana */
        win.jpActivarAlumno(ids[1]); S.ui.cfWeek = 0; win.sincronizarBloquesSemana(pB);
        pB.dias[0].bloques = pB.dias[0].bloques.filter(function(b){ return b.titulo !== 'WOD D1'; });
        win.jpActivarAlumno(ids[0]);
        return { s1EnB: win.asegurarBloquesPorSemana(pB.dias[0])[0].length, aIntacto: resA() === a0 };
      }
      if(c.caso === 'estructuraNula'){
        var out = {};
        var casos = { diasNull: function(p){ p.dias = null; }, diasVacio: function(p){ p.dias = []; }, diaNulo: function(p){ p.dias.splice(1, 0, null); }, sinBloques: function(p){ delete p.dias[0].bloques; } };
        Object.keys(casos).forEach(function(k){
          var p = alumno('ath_test_cr_' + k, 'N' + k, true); casos[k](p);
          var pp = win.plan('ath_test_cr_' + k); out[k] = pp.dias.length >= 3 && pp.dias.every(function(d){ return d && Array.isArray(d.bloques); });
        });
        return out;
      }
      if(c.caso === 'dibujo'){

        var txt = String(b.titulo || '') + ' ' + (b.items || []).join(' ');
        if(/zona 2/i.test(txt)) return;                                                   /* el día corto de recuperación cierra con cardio suave */
        n++;
        if(!/cierre metab/i.test(String(b.titulo || ''))) { P.push(tag + ': el último bloque no es un cierre metabólico'); return; }
        if(!FORMATO.test(txt)) P.push(tag + ': el cierre no tiene formato de competición (EMOM, AMRAP, For Time o intervalos)');
        if(!ESTACION.test(txt)) P.push(tag + ': el cierre no usa estaciones de competición');
        if(/battle\s*rope/i.test(txt)) P.push(tag + ': tiene battle ropes');
        var empuje = /^(push|hombro y pecho)\b|\bpush\b/i.test(dia) && !/pull/i.test(dia), traccion = /\bpull\b/i.test(dia) && !/push/i.test(dia);
        var pierna = /pierna|cuádriceps|cuadriceps|glúteo|gluteo|cadera/i.test(dia) && !empuje && !traccion;
        if(empuje && /flexion|press|slam|face pull/i.test(txt)) P.push(tag + ': día de empuje con estaciones de empuje en el cierre');
        if(traccion && /remo erg|skierg|ski erg|arrastre|sled pull|farmer/i.test(txt)) P.push(tag + ': día de tracción con estaciones de tracción o agarre en el cierre');
        if(pierna && /sled push|trineo x|escaladora|zancada|burpee|wall ball/i.test(txt)) P.push(tag + ': día de pierna o glúteo con estaciones de pierna en el cierre');
        if(pierna && !/skierg|ski erg|sled pull|arrastre/i.test(txt)) P.push(tag + ': día de pierna o glúteo sin tren superior en el cierre (SkiErg o arrastre)');
      });
    });
    if(n < 30) P.push('esperaba auditar al menos 30 cierres y revisé ' + n);
    return P;
  }
  /* Constructor de Glúteos: sin movimientos avanzados poco aplicables y con la metodología del tren inferior femenino */
  function auditarGluteos(){
    var P = [], S = getS(), n = 0;
    (S.banco || []).forEach(function(r){
      if(!/^bkstd_jp26_f\d_[ia]$/.test(r.id || '')) return;
      n++;
      var txt = JSON.stringify(r.dias || []);
      if(/weighted pull|dominadas lastradas/i.test(txt)) P.push(r.id + ': tiene dominadas lastradas');
      if(/rueda abdominal|ab wheel|piernas colgado|hanging leg|toes to bar/i.test(txt)) P.push(r.id + ': tiene ejercicios de core avanzados (rueda o colgado)');
      if(/back squat|sentadilla con barra/i.test(txt)) P.push(r.id + ': todavía usa la sentadilla con barra (fatiga axial)');
      if(!/hip thrust|barbell hip thrust/i.test(txt)) P.push(r.id + ': no tiene hip thrust');
      if(!/Tempo 2012/.test(txt)) P.push(r.id + ': el hip thrust no lleva pausa de 2 segundos arriba (Tempo 2012)');
      if(!/d[eé]ficit|deficit romanian/i.test(txt)) P.push(r.id + ': no tiene peso muerto rumano con déficit');
      if(!/torso inclinado|forward-lean/i.test(txt)) P.push(r.id + ': no tiene sentadilla búlgara con el torso inclinado');
      if(!/cruzada|cross-body/i.test(txt)) P.push(r.id + ': no tiene patada de glúteo en polea cruzada');
      if(!/a una pierna|single-leg/i.test(txt)) P.push(r.id + ': no tiene trabajo unilateral de cadera (puente o hip thrust a una pierna)');
    });

  /* ningún battle rope en ninguna plantilla del Banco (sistema, Banco Pro ni copias guardadas) */

  /* recomposición femenina: abre con cardio de baja intensidad en cinta con inclinación (10 a 15 min) y cierra con una máquina de cardio al fallo; sin dominadas lastradas */
  function auditarRecFem(){
    var P = [], S = getS(), n = 0;
    (S.banco || []).forEach(function(r){
      if(!/Recomposici/i.test(r.nombre || '') || r.genero !== 'f') return;
      n++;
      var txt = JSON.stringify(r.dias || []);
      if(/weighted pull|dominadas lastradas/i.test(txt)) P.push(r.id + ': tiene dominadas lastradas');
      (r.dias || []).forEach(function(d, k){
        var bl = d.bloques || [], a = bl[0], z = bl[bl.length - 1], tag = r.id + ' día ' + (k + 1);
        if(!a || !/cinta/i.test(String(a.titulo || '') + ' ' + (a.items || []).join(' ')) || !/inclinaci/i.test(String(a.titulo || '') + ' ' + (a.items || []).join(' '))) P.push(tag + ': no abre con cardio en cinta con inclinación');
        else { var m = /(\d+)\s*min/i.exec((a.items || []).join(' ') + ' ' + (a.titulo || '')); var mins = m ? parseInt(m[1], 10) : 0; if(mins < 10 || mins > 15) P.push(tag + ': el cardio pre-entreno dura ' + mins + ' min (tiene que ser de 10 a 15)'); }
        if(!z || !/echo bike|concept2|skierg|ski erg|ciclismo|bicicleta/i.test(String(z.titulo || '') + ' ' + (z.items || []).join(' '))) P.push(tag + ': no cierra con una máquina de cardio (Echo Bike, Concept2, SkiErg o ciclismo)');
        else if(!/fallo/i.test(String(z.titulo || '') + ' ' + (z.items || []).join(' '))) P.push(tag + ': el cierre en máquina no se lleva al fallo');
      });
    });

  function auditarSplit3(){
    var P = [], S = getS(), ESP = {
      m: [/^Push\b/, /^Pull\b/, /^Pierna Completa\b/],
      f: [/^Pierna A\b/, /^Push, Pull y Brazos\b/, /^Pierna B\b/]
    };
    ['m', 'f'].forEach(function(g){ ['i', 'a'].forEach(function(n){
      var id = 'bkstd_jp26_' + g + '3_' + n, r = (S.banco || []).filter(function(x){ return x.id === id; })[0];
      if(!r){ P.push(id + ': no existe'); return; }
      if((r.dias || []).length !== 3){ P.push(id + ': tiene ' + (r.dias || []).length + ' días y deberían ser 3'); return; }
      r.dias.forEach(function(d, k){
        var t = String(d.title || d.titulo || '');
        if(/full\s*body/i.test(t + ' ' + (d.short || ''))) P.push(id + ' día ' + (k + 1) + ': sigue siendo Full Body');
        if(!ESP[g][k].test(String(d.label || d.short || '').replace(/^DÍA \d+\s*\/\s*/, '') || t)) P.push(id + ' día ' + (k + 1) + ': esperaba ' + ESP[g][k] + ' y es «' + (d.label || d.short || t) + '»');
      });
    }); });
    return P;
  }

  /* ---------- generadores de IA (CrossFit): prevalidación y objetivo de la semana ---------- */
  function iaCaso(c){
    var AIx = win.CoachAI, S = getS(), toasts = [], llamadas = 0;
    var orig = { hay: AIx.hayClave, esp: AIx.esperaCooldown, cfg: AIx.config, gen: AIx.generarTexto, toast: win.toast, active: S.activeId };
    win.toast = function(m, k){ toasts.push((k || 'ok') + ': ' + m); };
    AIx.config = function(){ toasts.push('config'); };
    AIx.generarTexto = function(){ llamadas++; return Promise.resolve('{}'); };
    var ath = null;
    try{
      if(c.caso === 'sinClave'){ AIx.hayClave = function(){ return false; }; var ok = win.jpIAListo('probar'); return { ok: ok, avisoClave: toasts.some(function(x){ return /Configurá una clave/.test(x); }), cfgAbierto: toasts.indexOf('config') >= 0 }; }
      if(c.caso === 'pausa'){ AIx.hayClave = function(){ return true; }; AIx.esperaCooldown = function(){ return 45; }; var ok2 = win.jpIAListo('probar'); return { ok: ok2, avisoPausa: toasts.some(function(x){ return /en pausa/.test(x); }) }; }
      if(c.caso === 'listo'){ AIx.hayClave = function(){ return true; }; AIx.esperaCooldown = function(){ return 0; }; var ok3 = win.jpIAListo('probar'); return { ok: ok3, sinAvisos: toasts.length === 0 }; }
      if(c.caso === 'textoIA'){ return [win.jpTextoIA(null), win.jpTextoIA(['a', '', 'b']), win.jpTextoIA({ x: 'uno', y: ['dos'] }), win.jpTextoIA('  hola  ')]; }
      if(c.caso === 'ocupado'){ var b = { dataset: {}, isConnected: false }; var a1 = win.jpIAOcupado(b), a2 = win.jpIAOcupado(b); win.jpIALibre(b, null); var a3 = win.jpIAOcupado(b); return [a1, a2, a3]; }
      if(c.caso === 'resumen'){
        var plan = { dias: [{ title: 'Día 1', bloques: [
          { tipo: 'list', category: 'warmup', titulo: 'Entrada en calor', items: ['Remo 500 m'] },
          { tipo: 'list', category: 'strength', titulo: 'Back Squat', items: ['5x3 Back Squat @80%', 'Rest 3:00'] },
          { tipo: 'list', category: 'metcon', titulo: 'Fran', cfFmt: 'fortime', items: ['21-15-9 Thrusters', 'Pull-ups'] },
          { tipo: 'list', category: 'metcon', titulo: 'Vacío', items: [] } ] }, { title: 'Día 2', bloques: [] }] };
        var r = win.resumenSemanaCFParaIA(plan, 0);
        return { bloques: r.bloques, dias: r.dias, tieneSquat: /Back Squat/.test(r.texto), tieneFran: /Fran/.test(r.texto), sinWarmup: !/Remo 500/.test(r.texto), sinVacio: !/Vacío/.test(r.texto) };
      }
      /* handlers: con el motor sin clave NO se arma contexto ni se pide nada a la red, el botón queda libre y se avisa */
      if(c.caso === 'handlerObjetivo' || c.caso === 'handlerTips' || c.caso === 'handlerObjetivoSB' || c.caso === 'handlerTipsSB' || c.caso === 'handlerFichaSB'){
        AIx.hayClave = function(){ return false; };
        var esSB = /SB$/.test(c.caso), id = 'ath_test_ia', bl = esSB ? win.nuevoBloquePizarra(false, 'strength', 'Press de banca', ['Press de banca con barra', '4x8-10 | RIR 2']) : win.nuevoBloquePizarra(true, 'metcon', 'Fran', ['21-15-9 Thrusters', 'Pull-ups']);
        ath = { id: id, nombre: 'Prueba', apellido: 'IA', freq: 3, nivel: 'Avanzado', genero: 'F' };
        var guardar = win.save, render = win.renderBuilder; win.save = function(){}; win.renderBuilder = function(){};
        S.athletes.push(ath);
        try{
          var p = win.newPlan(ath); if(!esSB) p.meta.mesoDisc = 'crossfit'; p.dias[0].bloques.push(bl); S.plans[id] = p; S.activeId = id;
          var btn = { dataset: {}, isConnected: false, innerHTML: 'x', disabled: false };
          if(c.caso === 'handlerObjetivo' || c.caso === 'handlerObjetivoSB') win.generarObjetivoSemanaCF(btn);
          else if(c.caso === 'handlerTipsSB') win.generarTipsSports(bl.id, btn);
          else if(c.caso === 'handlerFichaSB') win.generarFocoDiaConIA(btn);
          else win.generarTipsPacingIA(bl.id, btn);
          return { llamadas: llamadas, avisoClave: toasts.some(function(x){ return /Configurá una clave/.test(x); }), botonLibre: !btn.disabled && !btn.dataset.iaBusy, sinFalsoError: !toasts.some(function(x){ return /revisá la conexión|Error en API/.test(x); }) };
        } finally { delete S.plans[id]; var ix = S.athletes.indexOf(ath); if(ix >= 0) S.athletes.splice(ix, 1); win.save = guardar; win.renderBuilder = render; }
      }
      throw new Error('caso desconocido: ' + c.caso);
    } finally {
      AIx.hayClave = orig.hay; AIx.esperaCooldown = orig.esp; AIx.config = orig.cfg; AIx.generarTexto = orig.gen; win.toast = orig.toast; S.activeId = orig.active;
    }
  }
  function alumnoObjetivoSemana(texto){
    var w = alumnoWin(); if(!w) throw new Error('no hay app del alumno');
    var wm = w.eval('WEEKS_META'), cur = w.eval('state.currentWeek') || 0, prev = wm[cur].objetivo;
    wm[cur].objetivo = texto;
    try{ w.renderWeekInfo(); return w.document.getElementById('weekInfoModalText').innerHTML; }
    finally{ wm[cur].objetivo = prev; w.renderWeekInfo(); }
  }
  function itemsPlanos(r){ var out = []; (r.dias || []).forEach(function(d){ (d.bloques || []).forEach(function(b){ out.push((b.items || []).map(function(x){ return typeof x === 'string' ? x : JSON.stringify(x); })); }); }); return out; }
  function restConsecutivos(r){ var n = 0; itemsPlanos(r).forEach(function(its){ for(var k = 1; k < its.length; k++){ if(/^\s*Rest\b/i.test(its[k]) && /^\s*Rest\b/i.test(its[k - 1])) n++; } }); return n; }

  function evaluar(c){
    var ad = ADAPT[c.fn]; if(!ad) throw new Error('fn desconocida: ' + c.fn);
    var r = ad.run(c.input), v = ad.valor(r), modo = c.modo || 'igual', ok, actual = v;
    switch(modo){
      case 'igual': ok = igual(v, c.expect); break;
      case 'subset': ok = subset(c.expect, v); break;
      case 'contiene': { var t = texto(v), lista = [].concat(c.expect); ok = lista.every(function(s){ return t.indexOf(s) >= 0; }); break; }
      case 'noContiene': { var t2 = texto(v), l2 = [].concat(c.expect); ok = l2.every(function(s){ return t2.indexOf(s) < 0; }); break; }
      case 'idempotente': { var sig = ad.siguiente(r); ok = igual(v, sig); actual = { primera: v, segunda: sig }; c = Object.assign({}, c, { expect: '(segunda pasada igual a la primera)' }); break; }
      case 'conPlaceholders': ok = r.placeholders === c.expect; actual = r.placeholders; break;
      case 'iaLineas': ok = r.ia.length === c.expect; actual = r.ia.length; break;
      case 'proyeccion': {
        var e = c.expect, okP = true;
        if(e.dias) okP = okP && subset(e.dias, v.dias);
        if(e.cantDias !== undefined) okP = okP && v.dias.length === e.cantDias;
        if(e.sinAvisos) okP = okP && v.avisos.every(function(a){ return !e.sinAvisos.test(a); });
        if(e.avisoContiene) okP = okP && v.avisos.some(function(a){ return a.indexOf(e.avisoContiene) >= 0; });
        ok = okP; actual = { dias: v.dias.map(function(d){ return { num: d.num, titulo: d.titulo, foco: d.foco, bloques: (d.bloques || []).map(function(b){ return { fase: b.fase, titulo: b.titulo, items: b.items, cierre: b.cierre }; }) }; }), avisos: v.avisos };
        break;
      }
      case 'proyeccionItems': {
        var e2 = c.expect, okI = true, planos = itemsPlanos(v), todo = planos.map(function(x){ return x.join('\n'); }).join('\n');
        if(e2.itemsContienen) okI = okI && e2.itemsContienen.every(function(s){ return todo.indexOf(s) >= 0; });
        if(e2.itemsNoContienen) okI = okI && e2.itemsNoContienen.every(function(s){ return todo.indexOf(s) < 0; });
        if(e2.cantBloques !== undefined) okI = okI && planos.length === e2.cantBloques;
        if(e2.restConsecutivos !== undefined) okI = okI && restConsecutivos(v) === e2.restConsecutivos;
        ok = okI; actual = { bloques: planos, restConsecutivos: restConsecutivos(v), avisos: v.avisos };
        break;
      }
      default: throw new Error('modo desconocido: ' + modo);
    }
    return { ok: !!ok, actual: actual, expect: c.expect };
  }

  function correr(){
    var res = [];
    window.JP_PARSER_CASES.forEach(function(c){
      var r;
      try{ r = evaluar(c); }catch(err){ r = { ok: false, actual: 'EXCEPCION: ' + (err && err.message || err), expect: c.expect }; }
      /* estado: pass | fail | gap (esperado que falle hoy) | gapfix (marcado gap pero ya pasa) */
      var estado = c.gap ? (r.ok ? 'gapfix' : 'gap') : (r.ok ? 'pass' : 'fail');
      res.push({ caso: c, estado: estado, actual: r.actual, expect: r.expect });
    });
    return res;
  }

  function pintar(res){
    var por = {}, orden = [];
    res.forEach(function(r){ var a = r.caso.area; if(!por[a]){ por[a] = []; orden.push(a); } por[a].push(r); });
    var cnt = { pass: 0, fail: 0, gap: 0, gapfix: 0 };
    res.forEach(function(r){ cnt[r.estado]++; });
    var html = '';
    orden.forEach(function(a){
      html += '<h2>' + esc(a) + '</h2>';
      por[a].forEach(function(r){
        var lbl = { pass: 'OK', fail: 'FALLA', gap: 'GAP', gapfix: 'YA PASA' }[r.estado];
        html += '<div class="row ' + r.estado + '" data-estado="' + r.estado + '"><div class="st">' + lbl + '</div><div><span class="id">' + esc(r.caso.id) + '</span> · ' + esc(r.caso.nota || '') +
          '<pre>' + esc(typeof r.caso.input === 'string' ? r.caso.input : fmt(r.caso.input)) + '</pre></div>';
        if(r.estado !== 'pass'){
          html += '<div class="cols"><div><b>Esperado</b><pre>' + esc(fmt(r.expect)) + '</pre></div><div><b>Actual</b><pre>' + esc(fmt(r.actual)) + '</pre></div></div>';
        }
        html += '</div>';
      });
    });
    document.getElementById('out').innerHTML = html;
    document.getElementById('pTotal').textContent = res.length + ' casos';
    document.getElementById('pOk').textContent = cnt.pass + ' ok';
    document.getElementById('pKo').textContent = cnt.fail + ' fallan';
    document.getElementById('pGp').textContent = cnt.gap + ' gaps' + (cnt.gapfix ? ' · ' + cnt.gapfix + ' ya pasan' : '');
    document.title = (cnt.fail ? '✗ ' : '✓ ') + cnt.pass + '/' + res.length + ' · Tests de parsers';
    aplicarFiltro();
    window.__jpTests = { total: res.length, pass: cnt.pass, fail: cnt.fail, gap: cnt.gap, gapfix: cnt.gapfix, fallas: res.filter(function(r){ return r.estado === 'fail'; }).map(function(r){ return { id: r.caso.id, esperado: r.expect, actual: r.actual }; }), gaps: res.filter(function(r){ return r.estado === 'gap' || r.estado === 'gapfix'; }).map(function(r){ return r.caso.id + ':' + r.estado; }) };
    window.__jpReporte = function(){
      var s = '# Tests de parsers\n\n' + cnt.pass + ' ok · ' + cnt.fail + ' fallan · ' + cnt.gap + ' gaps conocidos · ' + cnt.gapfix + ' gaps que ya pasan (total ' + res.length + ')\n';
      res.filter(function(r){ return r.estado !== 'pass'; }).forEach(function(r){
        s += '\n## ' + r.caso.id + ' [' + r.estado + ']\n' + (r.caso.nota || '') + '\n\nEntrada:\n```\n' + (typeof r.caso.input === 'string' ? r.caso.input : fmt(r.caso.input)) + '\n```\nEsperado:\n```\n' + fmt(r.expect) + '\n```\nActual:\n```\n' + fmt(r.actual) + '\n```\n';
      });
      return s;
    };
  }
  function aplicarFiltro(){
    var solo = document.getElementById('soloFallas').checked;
    [].forEach.call(document.querySelectorAll('.row'), function(el){ el.classList.toggle('hide', solo && el.getAttribute('data-estado') === 'pass'); });
  }
  document.getElementById('soloFallas').addEventListener('change', aplicarFiltro);
  document.getElementById('bReload').addEventListener('click', function(){ location.reload(); });
  document.getElementById('bCopiar').addEventListener('click', function(){ try{ navigator.clipboard.writeText(window.__jpReporte()); this.textContent = 'Copiado'; }catch(e){ this.textContent = 'No se pudo copiar'; } });

  var frame = document.getElementById('app'), intentos = 0;
  /* las plantillas del sistema se hidratan unos segundos después de cargar la app (arranque diferido): se espera a que estén las de Hyrox y las de Bodybuilding */
  function esperarBanco(n){
    var ok = false;
    try{ var b = getS().banco || []; ok = b.some(function(r){ return r && r.depDeporte === 'hyx' && (r.dias || []).length; }) && b.some(function(r){ return r && r.std && (r.dias || []).length; }); }catch(e){}
    if(ok || n > 60) setTimeout(function(){ prepararAlumno(function(){ var r = correr(); limpiarAlumno(); pintar(r); }); }, 300); else setTimeout(function(){ esperarBanco(n + 1); }, 250);
  }
  function listo(){
    try{ win = frame.contentWindow; return !!(win && win.jpAutoFormat && typeof win.jpDosisCanon === 'function' && typeof win.parsearImportacion === 'function' && typeof win.detectarFormatoCF === 'function' && typeof win.impCampoCoachDeTag === 'function'); }catch(e){ return false; }
  }
  var t = setInterval(function(){
    intentos++;
    if(listo()){ clearInterval(t); esperarBanco(0); }
    else if(intentos > 120){ clearInterval(t); document.getElementById('out').innerHTML = '<p>No se pudo acceder a la app dentro del iframe. Serví la carpeta por http (no file://) y abrí esta pagina desde el mismo servidor.</p>'; }
  }, 250);
})();
